<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>A spoken instruction goes to a language model in the cloud, which sends a task plan to the robot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241f3d"/>
      <stop offset="1" stop-color="#15131f"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#3a3358"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- 1. Instruction -->
  <g transform="translate(70 250)">
    <rect width="300" height="150" rx="28" fill="#2f2950" stroke="#6d55d8" stroke-width="3"/>
    <path d="M60 150 L52 196 L104 150 z" fill="#2f2950" stroke="#6d55d8" stroke-width="3" stroke-linejoin="round"/>
    <rect x="58" y="146" width="48" height="8" fill="#2f2950"/>
    <text x="150" y="68" text-anchor="middle" font-size="40" font-weight="700" fill="#ecebe8">“Tidy up</text>
    <text x="150" y="116" text-anchor="middle" font-size="40" font-weight="700" fill="#ecebe8">the table”</text>
  </g>

  <!-- 2. Cloud language model -->
  <g transform="translate(470 150)">
    <path d="M70 250 C10 250 0 170 60 158 C50 90 140 60 180 110 C200 40 320 30 340 120 C410 100 440 190 390 220 C410 250 380 250 360 250 Z"
          fill="#6d55d8"/>
    <text x="215" y="200" text-anchor="middle" font-size="64" font-weight="800" fill="#ffffff">LLM</text>
    <text x="215" y="310" text-anchor="middle" font-size="30" font-weight="600" fill="#b4a5ff">Oracle Cloud · LangGraph</text>
    <g font-size="28" fill="#c9c7c3" font-weight="600">
      <rect x="70" y="345" width="290" height="160" rx="18" fill="#1f1b33" stroke="#383c40" stroke-width="2"/>
      <text x="100" y="392" fill="#b4a5ff">1</text><text x="138" y="392">go to table</text>
      <text x="100" y="440" fill="#b4a5ff">2</text><text x="138" y="440">pick up cup</text>
      <text x="100" y="488" fill="#b4a5ff">3</text><text x="138" y="488">place in sink</text>
    </g>
  </g>

  <!-- 3. Robot -->
  <g transform="translate(985 175)">
    <rect x="22" y="0" width="116" height="62" rx="14" fill="#f4f1e8"/>
    <rect x="40" y="20" width="80" height="22" rx="8" fill="#2b2d42"/>
    <circle cx="62" cy="31" r="6" fill="#b4a5ff"/><circle cx="98" cy="31" r="6" fill="#b4a5ff"/>
    <rect x="66" y="62" width="28" height="20" fill="#2b2d42"/>
    <rect x="20" y="82" width="120" height="140" rx="16" fill="#f4f1e8"/>
    <rect x="50" y="112" width="60" height="50" rx="6" fill="#2b2d42"/>
    <path d="M146 100 L170 170 L150 230" fill="none" stroke="#f4f1e8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M138 240 L150 230 L162 244" fill="none" stroke="#2b2d42" stroke-width="8" stroke-linecap="round"/>
    <rect x="58" y="222" width="44" height="90" fill="#2b2d42"/>
    <rect x="0" y="312" width="160" height="56" rx="26" fill="#f4f1e8"/>
    <rect x="0" y="352" width="160" height="16" rx="8" fill="#2b2d42"/>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#b4a5ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M382 318 C430 300 460 300 508 318"/>
    <path d="M490 302 L510 319 L486 330"/>
    <path d="M842 575 C900 580 935 545 958 500"/>
    <path d="M936 506 L960 496 L966 522"/>
  </g>
</svg>
